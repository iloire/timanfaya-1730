name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # GitHub Pages serves the site from /<repo>/, so the bundle and the terrain URLs need that base.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Green means this commit is live: deployed to Pages and answering on the real URL.
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsS "$URL" | grep -q '<title>Timanfaya 1730'
          curl -fsS "${URL}sites/lanzarote/lava.json" | grep -q episode
          curl -fsS -o /dev/null "${URL}sites/lanzarote/detail/10_10.jpg"
